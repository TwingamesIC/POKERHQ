<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Pro Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .grid-poker { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; }
        .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; border-radius: 2px; cursor: pointer; }
        .range-open { background-color: #10b981; color: white; } /* Verde Grinderlab */
        .range-fold { background-color: #f3f4f6; color: #9ca3af; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <!-- Sidebar / Nav -->
    <nav class="flex justify-around bg-gray-800 p-4 border-b border-gray-700">
        <button onclick="showSection('ranges')" class="hover:text-blue-400">Range Charts</button>
        <button onclick="showSection('bankroll')" class="hover:text-blue-400">Bankroll Tracker</button>
        <button onclick="showSection('calc')" class="hover:text-blue-400">Equity Calc</button>
    </nav>

    <main class="p-6">
        
        <!-- SEZIONE RANGE -->
        <section id="ranges" class="section-content">
            <h2 class="text-2xl font-bold mb-4">Range Viewer (Stile Grinderlab)</h2>
            <div class="mb-4">
                <select class="bg-gray-700 p-2 rounded">
                    <option>UTG Open Raise (20bb)</option>
                    <option>BTN vs CO 3bet</option>
                </select>
            </div>
            <div id="poker-grid" class="grid-poker max-w-2xl bg-gray-800 p-2 rounded-lg"></div>
        </section>

        <!-- SEZIONE BANKROLL -->
        <section id="bankroll" class="section-content hidden">
            <h2 class="text-2xl font-bold mb-4">Bankroll & Statistiche</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-gray-800 p-4 rounded shadow">
                    <p class="text-gray-400">Bilancio Totale</p>
                    <p id="total-br" class="text-3xl font-bold text-green-400">€ 0.00</p>
                </div>
                <div class="bg-gray-800 p-4 rounded shadow">
                    <p class="text-gray-400">ROI %</p>
                    <p class="text-3xl font-bold text-blue-400">--</p>
                </div>
                <div class="bg-gray-800 p-4 rounded shadow col-span-2">
                    <canvas id="brChart" height="100"></canvas>
                </div>
            </div>
            <!-- Form Aggiunta Torneo -->
            <div class="bg-gray-800 p-4 rounded mb-6">
                <h3 class="font-bold mb-2">Aggiungi Torneo</h3>
                <div class="flex flex-wrap gap-2">
                    <input id="t-name" type="text" placeholder="Nome Torneo" class="bg-gray-700 p-2 rounded">
                    <input id="t-buyin" type="number" placeholder="Buy-in (€)" class="bg-gray-700 p-2 rounded w-24">
                    <input id="t-win" type="number" placeholder="Vincita (€)" class="bg-gray-700 p-2 rounded w-24">
                    <button onclick="addTournament()" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-500">Salva</button>
                </div>
            </div>
        </section>

        <!-- SEZIONE CALCULATOR -->
        <section id="calc" class="section-content hidden">
            <h2 class="text-2xl font-bold mb-4">Pot Odds & Equity</h2>
            <div class="max-w-md bg-gray-800 p-6 rounded shadow">
                <div class="mb-4">
                    <label class="block text-sm text-gray-400">Dimensione del Piatto (€)</label>
                    <input id="pot-size" type="number" class="w-full bg-gray-700 p-2 rounded mt-1" placeholder="Es: 100">
                </div>
                <div class="mb-4">
                    <label class="block text-sm text-gray-400">Scommessa da chiamare (€)</label>
                    <input id="call-size" type="number" class="w-full bg-gray-700 p-2 rounded mt-1" placeholder="Es: 50">
                </div>
                <button onclick="calcOdds()" class="w-full bg-green-600 p-2 rounded font-bold uppercase">Calcola</button>
                <div id="odds-result" class="mt-4 p-3 bg-gray-900 rounded hidden"></div>
            </div>
        </section>

    </main>

    <script>
        // Logica Navigazione
        function showSection(id) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // Generazione Griglia Range
        const ranks = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
        const grid = document.getElementById('poker-grid');
        
        ranks.forEach((r1, i) => {
            ranks.forEach((r2, j) => {
                const cell = document.createElement('div');
                let label = i < j ? r1 + r2 + 's' : (i > j ? r2 + r1 + 'o' : r1 + r2);
                cell.className = 'cell range-fold';
                cell.innerText = label;
                // Esempio logica Grinderlab (fittizia per demo)
                if(i < 3 && j < 3) cell.className = 'cell range-open';
                grid.appendChild(cell);
            });
        });

        // Logica Bankroll
        let tournaments = [];
        let brChart;
        function addTournament() {
            const buyin = parseFloat(document.getElementById('t-buyin').value);
            const win = parseFloat(document.getElementById('t-win').value);
            const profit = win - buyin;
            tournaments.push(profit);
            updateBankroll();
        }

        function updateBankroll() {
            let total = tournaments.reduce((a, b) => a + b, 0);
            document.getElementById('total-br').innerText = `€ ${total.toFixed(2)}`;
            updateChart();
        }

        function updateChart() {
            const ctx = document.getElementById('brChart').getContext('2d');
            let cumulative = 0;
            const data = tournaments.map(v => cumulative += v);
            
            if (brChart) brChart.destroy();
            brChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: tournaments.map((_, i) => i + 1),
                    datasets: [{ label: 'Andamento BR', data: data, borderColor: '#3b82f6', tension: 0.1 }]
                },
                options: { scales: { y: { grid: { color: '#374151' } } } }
            });
        }

        // Calcolatore Odds
        function calcOdds() {
            const pot = parseFloat(document.getElementById('pot-size').value);
            const call = parseFloat(document.getElementById('call-size').value);
            const totalPot = pot + call;
            const equityNeeded = (call / (totalPot + call)) * 100;
            
            const res = document.getElementById('odds-result');
            res.classList.remove('hidden');
            res.innerHTML = `
                <p>Pot Odds: 1:${(pot/call).toFixed(1)}</p>
                <p>Equity necessaria: <span class="text-yellow-400 font-bold">${equityNeeded.toFixed(1)}%</span></p>
            `;
        }
    </script>
</body>
</html>
